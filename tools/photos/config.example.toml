# The race photos tool's settings. Copy this file to config.toml in the work folder,
# ~/nn-photos/ by default, which must be outside any git repository: the tool refuses to
# run anywhere else. Paths are relative to the work folder unless they start with / or ~.
#
# The [r2] section at the foot holds an R2 API token, which is one more reason this file
# never lives inside the repository. The tool never prints it.

# The running of the race these photos are from, and the prefix of the short IDs people
# read out (NN26-0412).
event_slug = "nn-2026"
short_id_prefix = "NN26"

# One folder per photographer, copied from Drive, named as in photographers.csv.
originals = "originals"

# folder,credit,spot — one row per folder of originals.
photographers = "photographers.csv"

# One column, bib, and nothing else. Any other column is refused.
bibs = "bibs.csv"

[reader]
# Only the fake reader exists until the vision model provider is chosen. It answers from
# fake_reads, a JSON file mapping a photo's path under originals to the model's answer; a
# photo it has no answer for reads as "no bib seen". Leave fake_reads out to read nothing.
kind = "fake"
# fake_reads = "fake-reads.json"

# Where `photos upload` sends the copies. Leave the section out for dry runs. The bucket is
# made in the EU jurisdiction by the Cloudflare account holder, and the token is an R2 API
# token with Object Read & Write on that bucket alone, revoked after each upload. See
# docs/delivery/runbooks/race-photos.md.
# [r2]
# account_id = "<the 32-character Cloudflare account ID>"
# bucket = "src-race-photos"
# access_key_id = "<the token's Access Key ID>"
# secret_access_key = "<the token's Secret Access Key>"
