<!-- The browser-tab icon: the club's initials, "SRC", rather than the full wordmark.

     **This replaces a favicon that was the full "SOUTHVILLE RUNNING CLUB" wordmark shrunk
     into a 100x100 box.** At a 16-32px tab size that rendered as an illegible smear of fine
     print rather than a mark — the two-line wordmark was traced at a size meant for a
     banner, not a tab icon, and shrinking it doesn't make it a monogram. `docs/foundations/
     brand.md` claimed a separately-traced "SRC" monogram was already in use here; the file
     that actually shipped never was one. This corrects that.

     **Set in type, not traced from an asset**, because no source artwork for a club "SRC"
     monogram exists anywhere in this repository or its downloaded brand assets
     (SRC_GREEN.png, logo_src.svg) — inventing a geometric mark and presenting it as the
     club's would be exactly the kind of unconfirmed brand fact this repository's principles
     say not to guess at. Three bold letters in Inter, the repository's own vendored
     typeface, is a legible, honest placeholder rather than a fabricated logotype; if the
     club has (or commissions) real "SRC" mark artwork, that should replace this file
     directly.

     Colour is `#00c85a`, the race-timing app's brand green adopted 16 August 2026 (see
     `docs/foundations/race-timing-brand-guidelines.md`), baked in because a static favicon
     cannot read a CSS custom property. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Southville Running Club">
  <text
    x="50"
    y="50"
    fill="#00c85a"
    font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="42"
    letter-spacing="-1"
    text-anchor="middle"
    dominant-baseline="central"
  >SRC</text>
</svg>
