# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "src-platform"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. `public` and `graphql_public` schemas are included by default.
#
# `intake` is exposed because a public form has to reach it. **`club` is deliberately
# absent**, and that absence is a layer of defence in its own right: even if a grant on a
# `club` table were wrong one day, PostgREST would still have no route to it. Adding `club`
# here is a decision, not a convenience.
#
# `entries` is exposed for exactly one object: `entries.entry_state()`, the function the
# `/nn/` page calls to find out whether entries are open. **Every table in that schema is
# reachable by this route and refuses anyway** — RLS is on from their first migration and
# the anon role holds no grant on any of them, so PostgREST routes the request and Postgres
# answers `42501`. `tests/entries.test.ts` asserts that on every table, which is what makes
# exposing the schema safe rather than merely intended.
#
# `public` holds the timing platform's tables and is migrated from `src-race-timing`.
# See docs/architecture/decisions/adr-002-schema-layout.md
#
# `identity` — ADR-015's schema for the account and role — is added in the same migration
# that creates it (#51), not before: exposing a schema PostgREST cannot find is untested,
# and #49 did not need it.
schemas = ["public", "graphql_public", "intake", "entries", "identity"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000
# Controls whether new tables, views, sequences and functions created in the `public` schema by
# `postgres` are reachable through the Data API roles (`anon`, `authenticated`, `service_role`)
# without explicit GRANTs. When unset, new entities are NOT auto-exposed, matching the new cloud
# default. Set to `true` to keep the legacy behaviour of auto-exposing new entities; this is
# deprecated and the field is removed on 2026-10-30 once the always-revoked behaviour is permanent.
# auto_expose_new_tables = true

[api.tls]
# Enable HTTPS endpoints locally using a self-signed certificate.
enabled = false
# Paths to self-signed certificate pair.
# cert_path = "../certs/my-cert.pem"
# key_path = "../certs/my-key.pem"

[db]
# Port to use for the local database URL.
port = 54322
# Port used by db diff command to initialize the shadow database.
shadow_port = 54320
# Maximum amount of time to wait for health check when starting the local database.
health_timeout = "2m"
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 17

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

# [db.vault]
# secret_key = "env(SECRET_VALUE)"

[db.migrations]
# If disabled, migrations will be skipped during a db push or reset.
enabled = true
# Specifies an ordered list of schema files, directories, or glob patterns that describe your database.
# Supports paths relative to supabase directory: "./schemas/*.sql", "./database".
schema_paths = []

[db.seed]
# If enabled, seeds the database after migrations during a db reset.
enabled = true
# Specifies an ordered list of seed files to load during db reset.
# Supports glob patterns relative to supabase directory: "./seeds/*.sql"
sql_paths = ["./seed.sql"]

[db.network_restrictions]
# Enable management of network restrictions.
enabled = false
# List of IPv4 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv4 connections. Set empty array to block all IPs.
allowed_cidrs = ["0.0.0.0/0"]
# List of IPv6 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv6 connections. Set empty array to block all IPs.
allowed_cidrs_v6 = ["::/0"]

# Uncomment to reject non-secure connections to the database.
# [db.ssl_enforcement]
# enabled = true

[realtime]
enabled = true
# Bind realtime via either IPv4 or IPv6. (default: IPv4)
# ip_version = "IPv6"
# The maximum length in bytes of HTTP request headers. (default: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
# OpenAI API Key to use for Supabase AI in the Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[local_smtp]
enabled = true
# Port to use for the email testing server web interface.
port = 54324
# Uncomment to expose additional ports for testing user applications that send emails.
# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

# Uncomment to configure local storage buckets
# [storage.buckets.images]
# public = false
# file_size_limit = "50MiB"
# allowed_mime_types = ["image/png", "image/jpeg"]
# objects_path = "./images"

# Allow connections via S3 compatible clients
[storage.s3_protocol]
enabled = true

# Image transformation API is available to Supabase Pro plan.
# [storage.image_transformation]
# enabled = true

# Store analytical data in S3 for running ETL jobs over Iceberg Catalog
# This feature is only available on the hosted platform.
[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

# Analytics Buckets is available to Supabase Pro plan.
# [storage.analytics.buckets.my-warehouse]

# Store vector embeddings in S3 for large and durable datasets
[storage.vector]
enabled = true
max_buckets = 10
max_indexes = 5

# Vector Buckets is available to Supabase Pro plan.
# [storage.vector.buckets.documents-openai]

[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
#
# **This is the value the CLI ships as a placeholder, and it must not stay that way.**
# `supabase config push` sends this whole block to the shared production project on every
# merge that touches a migration (deploy-db.yml) — so a localhost site_url here is not a
# local setting, it is what production would actually run with. The timing app's port
# (ADR-008) uses Supabase Auth magic links, and a magic link is built from this value: get
# it wrong and sign-in breaks the moment somebody clicks the email, not the moment the code
# merges. `tests/unit/config.test.ts` asserts this is the real hostname, not the CLI default.
#
# `new.` because that is still the club's one public hostname — ADR-007. It drops at the
# Squarespace cutover along with everything else that names it.
site_url = "https://new.southvillerunningclub.co.uk"
# The public URL that Auth serves on. Defaults to the API external URL with `/auth/v1` appended.
# external_url = ""
# A list of URLs auth providers are permitted to redirect to post authentication. Despite the
# "exact URLs" wording Supabase ships in this comment, `**` wildcards are honoured — worth
# knowing, because the timing app's own callback path is not decided yet (Phase 4's
# territory, not this skeleton's), so the production entry is deliberately broad rather than
# a guessed exact path. Local entries stay so `supabase start` keeps working on a laptop.
#
# `/account/callback/` — where a magic link and a Google OAuth redirect land, #55 and #56 —
# needs no entry of its own. It is a path under the club hostname, and the `/**` wildcard
# on `https://new.southvillerunningclub.co.uk` already covers it, same for the two
# localhost entries below.
additional_redirect_urls = ["https://new.southvillerunningclub.co.uk/**", "http://127.0.0.1:3000/**", "http://localhost:8787/**"]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 (1 week).
jwt_expiry = 3600
# JWT issuer URL. If not set, defaults to auth.external_url.
# jwt_issuer = ""
# Path to JWT signing key. DO NOT commit your signing keys file to git.
# signing_keys_path = "./signing_keys.json"
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval in seconds.
# Requires enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project.
#
# **On, as of #49.** Decided in decision 005 and ADR-015
# (../../../../docs/decisions/decision-log.md#005--give-the-platform-member-accounts-on-supabase-auth,
# ../../../../docs/architecture/decisions/adr-015-member-accounts-on-supabase-auth.md), and
# safe to turn on because RLS, not this flag, is what stops a signed-up account doing
# anything — every table any of the three roles can reach still needs its own grant and
# policy. This is still a stop-and-ask
# (../../../../docs/architecture/principles.md#stop-and-ask): any further edit to this value,
# to `site_url`, or to a redirect URL is production config the moment it merges.
#
# **The gate this switch was supposed to wait for is #64's**, and it is written down in
# `../../../../docs/delivery/runbooks/accounts-open.md`: the Cloudflare rate-limiting rules on
# the credential endpoints must be live before anybody can sign in, because this flag is what
# turns `POST /account/sign-up/` and `POST /account/sign-in/` into endpoints a stranger can
# spend the club's compute and the club's sending reputation on. **This value merged before
# those rules existed**, so that runbook's step 0 is a catch-up rather than a pre-condition —
# which is exactly the thing it exists to stop happening a second time. Turning this back off
# is the rollback, and it is one line.
enable_signup = true
# Allow/disallow anonymous sign-ins to your project.
enable_anonymous_sign_ins = false
# Allow/disallow testing manual linking of accounts
enable_manual_linking = false
# Passwords shorter than this value will be rejected as weak. Minimum 6, recommended 8 or more.
#
# Twelve, not the CLI default of six, which had never been exercised. **Length over
# composition rules** — `password_requirements` stays empty deliberately, below.
minimum_password_length = 12
# Passwords that do not meet the following requirements will be rejected as weak. Supported values
# are: `letters_digits`, `lower_upper_letters_digits`, `lower_upper_letters_digits_symbols`
#
# **Deliberately empty.** Both NCSC and NIST advise against composition rules — they push
# people towards `Password1!` and a sticky note, not towards a stronger password. Length is
# the control that actually works, and `minimum_password_length` above is it.
password_requirements = ""

# Configure passkey sign-ins.
# [auth.passkey]
# enabled = false

# Configure WebAuthn relying party settings (required when passkey is enabled).
# [auth.webauthn]
# rp_display_name = "Supabase"
# rp_id = "localhost"
# rp_origins = ["http://127.0.0.1:3000"]

# **Every value in this block is chosen, and each comment says what the number is
# protecting.** #64. Until now the whole block was the CLI's own defaults, kept and
# annotated by #49 — reviewed, which is not the same as decided.
#
# **The trap that decides almost every number below: "per IP address" is not the runner's
# IP address.** Every GoTrue call the account area makes is made *from the Worker* —
# `worker/account.ts` and `worker/session.ts` build a server-side client and call `signUp`,
# `signInWithPassword`, `resetPasswordForEmail` and `refreshSession` themselves — so the
# address GoTrue counts against is a Cloudflare egress address shared by everybody at once.
# **A per-IP limit behind a proxy is a project-wide limit**, and a number that reads as
# generous for one person is a cap on the whole club. So the values that sit behind the
# Worker are raised rather than lowered, and their job is to be a circuit breaker the club
# cannot reach rather than a per-person control.
#
# **The per-person control is a layer earlier**, in the Cloudflare rate-limiting rules
# recorded in `../../../../docs/reference/cloudflare-waf-rules.md` — those see the real
# client address, and they are what actually answers credential stuffing and a reset form
# pointed at somebody else's inbox. Neither layer is a substitute for the other, and the
# runbook that gates them both is
# `../../../../docs/delivery/runbooks/accounts-open.md`.
#
# `token_verifications` is the one value that goes the other way, and its comment says why.
[auth.rate_limit]
# Number of emails that can be sent per hour. Requires auth.email.smtp to be enabled.
#
# **Sixty, and this one is per project rather than per IP** — Supabase documents it as a
# project limit and GoTrue implements it as one, which the CLI's own comment above does not
# say. Today it is shadowed by the built-in two-an-hour cap the free tier applies whatever
# is written here; **#50's Resend SMTP is the day this number becomes the real ceiling on
# every confirmation, reset and notification the club sends**, so it is chosen for that day
# rather than for this one.
#
# Sixty is one a minute. The busiest legitimate hour this platform has is the club being
# told its accounts exist, which is low hundreds of people of whom the ones who act inside
# the first hour are dozens — and the failure mode of setting it too low is **silent**: the
# person simply never receives the mail and sees no error at all. It is still far below what
# a script pointed at `POST /account/reset/` produces in a minute; the WAF rule is what stops
# that, not this.
email_sent = 60
# Number of SMS messages that can be sent per hour. Requires auth.sms to be enabled.
#
# **One, because nothing here can send an SMS.** `[auth.sms] enable_signup` is off, its
# confirmations are off, `[auth.sms.twilio]` is disabled and `[auth.mfa.phone]` is off — so
# this value is unreachable, and the reason to set a floor rather than leave 30 is that a
# switch flipped by mistake then costs one message rather than thirty. Not zero: a zero in a
# Go rate limiter is the value most likely to be read as "no limit", and this is not a place
# to find that out. **If SMS is ever turned on, this number is part of that decision.**
sms_sent = 1
# Number of anonymous sign-ins that can be made per hour per IP address. Requires enable_anonymous_sign_ins = true.
#
# **One, for the same reason as `sms_sent`.** `enable_anonymous_sign_ins` is false, and an
# anonymous sign-in is a row in `auth.users` that nobody asked for — the free tier's own
# ceiling is one of the two ways this platform runs out of database, so the floor is the
# right default for a feature that is off.
anonymous_users = 1
# Number of sessions that can be refreshed in a 5 minute interval per IP address.
#
# **Six hundred, up from 150, and it is raised because of the proxy.** `worker/session.ts`
# refreshes from the Worker, so every signed-in person on the site counts against one
# address. `jwt_expiry` is an hour and the refresh happens inside the last minute of it,
# which means **refreshes arrive synchronised**: everybody who signed in during the minute
# entries opened comes back for a new token in the same minute an hour later. At 150 a
# five-minute window that burst is refused, and being refused a refresh means being signed
# out — plausibly in the middle of entering a race. A refresh also needs a valid refresh
# token, so this is not an anonymous attack surface and the cost of being generous is small.
token_refresh = 600
# Number of sign up and sign-in requests that can be made in a 5 minute interval per IP address (excludes anonymous users).
#
# **Three hundred, up from 30, and the increase is the point rather than a slip.** Behind
# the Worker this is not "thirty attempts per attacker", it is **thirty sign-ins in five
# minutes for the entire club** — about one every ten seconds, shared. The morning entries
# open would reach that on legitimate traffic alone, and GoTrue's refusal reads to somebody
# with the right password as the site being broken.
#
# So it stops being a credential-stuffing control the moment it sits behind a proxy, and
# pretending otherwise is what makes a low number dangerous: it buys nothing an attacker
# notices and it locks out a club. **Stuffing is answered by the WAF rule on
# `POST /account/sign-in/`** — five a minute per real address, blocked for ten — and by
# Turnstile on the form. Three hundred is what is left for this layer to do: a project-wide
# ceiling of one a second, high enough that no plausible club morning reaches it and low
# enough that a flood which got past Cloudflare cannot exhaust the auth service.
sign_in_sign_ups = 300
# Number of OTP / Magic link verifications that can be made in a 5 minute interval per IP address.
#
# **Ten, down from 30, and the only value here that is genuinely per person.** A
# confirmation, reset or magic link points at GoTrue's own `/auth/v1/verify`, which **the
# browser follows directly** — the Worker is not in that path, so the address counted is
# the person's own.
#
# That makes it the one place a per-IP number does what it says, and it is also the endpoint
# an OTP guess attacks: `otp_length` is 6, so the space is a million, and 30 per five minutes
# is 8,640 a day from a single address. Ten is 2,880 — still not an answer to a distributed
# guess, which nothing per-IP is, but a third of the budget for no cost anybody meets. A
# person clicks their link once; ten in five minutes already covers a household, a retry, and
# a corporate mail scanner prefetching the link before the person sees it.
#
# **Revisit this the day a code exchange moves into the Worker** — #55's magic link or #56's
# Google callback done as PKCE would put this value back behind the proxy, where ten would be
# ten for everybody.
token_verifications = 10
# Number of Web3 logins that can be made in a 5 minute interval per IP address.
#
# **One.** `[auth.web3.solana]` is disabled and a running club does not sign people in with a
# wallet. Same floor, same reason as `sms_sent`.
web3 = 1

# Configure one of the supported captcha providers: `hcaptcha`, `turnstile`.
#
# **On, as of #53.** #49 left this commented out: the CLI validates every `env(...)`
# substitution at startup, and `SUPABASE_AUTH_CAPTCHA_SECRET` was unset everywhere that
# mattered — enabling this block without it broke `supabase start` outright.
#
# It stays that way for anyone running the stack **without a real secret exported**, and
# that is deliberate rather than a gap: `ci.yml`'s "Start the local Supabase stack" step and
# `./dev`'s `export_supabase_env` both set this to Cloudflare's own published testing
# secret, `1x0000000000000000000000000000000AA` — publicly documented at
# developers.cloudflare.com/turnstile/troubleshooting/testing as "always passes", paired
# with the equally public dummy site key `wrangler.jsonc`'s top-level `vars` carries. So the
# local and CI stacks start and validate real submissions without anybody needing the
# club's actual Turnstile secret, which lives only as a GitHub Actions repository secret
# (`SUPABASE_AUTH_CAPTCHA_SECRET`) that `deploy-db.yml` passes to `supabase config push`.
[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[auth.email]
# Allow/disallow new user signups via email to your project.
#
# On, matching the top-level `[auth] enable_signup` — belt and braces rather than relying
# on the master switch alone.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
#
# **On, and the single most important line in this block.** Without it an unverified
# address is a signed-in account, and anybody can register somebody else's email — an
# account that reads as somebody's before they have proved it is theirs.
enable_confirmations = true
# If enabled, users will need to reauthenticate or have logged in recently to change their password.
#
# On, so a stolen session cannot silently change the password it was stolen with — the
# person has to re-authenticate first, which is also the moment a real owner notices.
secure_password_change = true
# Controls the minimum amount of time that must pass before sending another signup confirmation or password reset email.
max_frequency = "1s"
# Number of characters used in the email OTP.
otp_length = 6
# Number of seconds before the email OTP expires (defaults to 1 hour).
otp_expiry = 3600

# Use a production-ready SMTP server
# [auth.email.smtp]
# enabled = true
# host = "smtp.sendgrid.net"
# port = 587
# user = "apikey"
# pass = "env(SENDGRID_API_KEY)"
# admin_email = "admin@email.com"
# sender_name = "Admin"

# Uncomment to customize email template
# [auth.email.template.invite]
# subject = "You have been invited"
# content_path = "./supabase/templates/invite.html"

# **Off, and not because the club does not want it.** #54 turned this on for the right
# reason: it is the only way somebody finds out their password changed without their own
# knowledge — a stolen session, or a reset they did not request. The platform cannot keep
# that promise yet, and a promise it cannot keep is worse than an absence it admits to.
#
# **The free tier refuses it outright.** With the default email provider in use, the
# management API rejects *any* email-template modification, and `enabled = true` here is
# one — the CLI sends it with an empty `subject` alongside:
#
#     unexpected status 400: {"message":"Email template modification is not available for
#     free tier projects using the default email provider. Please upgrade your plan or
#     configure a custom SMTP provider."}
#
# There is no partial apply, so this one line failed `supabase config push` **and with it
# the whole of this file** on every merge from 25 August 2026 until it was turned off —
# `[api]`'s schema list, `site_url`, the redirect allowlist, `enable_signup` and the
# captcha secret included. `db push` runs first and kept succeeding, which is why the
# deploy looked half-done rather than broken. Issue #79.
#
# **The whole block is commented out, and that is the fix rather than `enabled = false`.**
# Turning it off was not enough and the deploy went on failing: the CLI serialises this
# section whenever it is *present* in the file, filling in the `subject` it was not given —
# so `config push` kept sending `subject = ""` against production's
# `subject = "Your password was changed"`, and an empty subject is still a template
# modification. The remote-vs-local diff the CLI prints before the 400 is exactly that one
# line, with `enabled = false` already agreeing on both sides.
#
# The CLI shipped this section commented out and every deploy succeeded for a fortnight;
# #76 uncommented it. Commented is therefore the known-good state, not merely a tidy one.
#
# **#50 is what may turn it back on** — Resend over SMTP, in `[auth.email.smtp]` above.
# That is the only half of the API's own sentence that is the club's plan; upgrading the
# tier is not. `tests/unit/config.test.ts` fails if this, or any other email template,
# comes back before the custom provider does — including, now, a disabled one.
#
# [auth.email.notification.password_changed]
# enabled = true
# subject = "Your password has been changed"
# content_path = "./templates/password_changed_notification.html"

[auth.sms]
# Allow/disallow new user signups via SMS to your project.
enable_signup = false
# If enabled, users need to confirm their phone number before signing in.
enable_confirmations = false
# Template for sending OTP to users
template = "Your code is {{ .Code }}"
# Controls the minimum amount of time that must pass before sending another sms otp.
max_frequency = "5s"

# Use pre-defined map of phone number to OTP for testing.
# [auth.sms.test_otp]
# 4152127777 = "123456"

# Configure logged in session timeouts.
# [auth.sessions]
# Force log out after the specified duration.
# timebox = "24h"
# Force log out if the user has been inactive longer than the specified duration.
# inactivity_timeout = "8h"

# This hook runs before a new user is created and allows developers to reject the request based on the incoming user object.
# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/auth/before-user-created-hook"

# This hook runs before a token is issued and allows you to add additional claims based on the authentication method used.
# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"

# Configure one of the supported SMS providers: `twilio`, `twilio_verify`, `messagebird`, `textlocal`, `vonage`.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# DO NOT commit your Twilio auth token to git. Use environment variable substitution instead:
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Multi-factor-authentication is available to Supabase Pro plan.
[auth.mfa]
# Control how many MFA factors can be enrolled at once per user.
max_enrolled_factors = 10

# Control MFA via App Authenticator (TOTP)
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

# Configure MFA via Phone Messaging
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# Configure MFA via WebAuthn
# [auth.mfa.web_authn]
# enroll_enabled = true
# verify_enabled = true

# Use an external OAuth provider. The full list of providers are: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin_oidc`, `notion`, `twitch`,
# `twitter`, `x`, `slack`, `spotify`, `workos`, `zoom`.
[auth.external.apple]
enabled = false
client_id = ""
# DO NOT commit your OAuth provider secret to git. Use environment variable substitution instead:
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# Overrides the default auth callback URL derived from auth.external_url.
redirect_uri = ""
# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
# or any other third-party OIDC providers.
url = ""
# If enabled, the nonce check will be skipped. Required for local sign in with Google auth.
skip_nonce_check = false
# If enabled, it will allow the user to successfully authenticate when the provider does not return an email address.
email_optional = false

# Allow Solana wallet holders to sign in to your project via the Sign in with Solana (SIWS, EIP-4361) standard.
# You can configure "web3" rate limit in the [auth.rate_limit] section and set up [auth.captcha] if self-hosting.
[auth.web3.solana]
enabled = false

# Use Firebase Auth as a third-party provider alongside Supabase Auth.
[auth.third_party.firebase]
enabled = false
# project_id = "my-firebase-project"

# Use Auth0 as a third-party provider alongside Supabase Auth.
[auth.third_party.auth0]
enabled = false
# tenant = "my-auth0-tenant"
# tenant_region = "us"

# Use AWS Cognito (Amplify) as a third-party provider alongside Supabase Auth.
[auth.third_party.aws_cognito]
enabled = false
# user_pool_id = "my-user-pool-id"
# user_pool_region = "us-east-1"

# Use Clerk as a third-party provider alongside Supabase Auth.
[auth.third_party.clerk]
enabled = false
# Obtain from https://clerk.com/setup/supabase
# domain = "example.clerk.accounts.dev"

# OAuth server configuration
[auth.oauth_server]
# Enable OAuth server functionality
enabled = false
# Path for OAuth consent flow UI
authorization_url_path = "/oauth/consent"
# Allow dynamic client registration
allow_dynamic_registration = false

[edge_runtime]
enabled = true
# Supported request policies: `oneshot`, `per_worker`.
# `per_worker` (default) — enables hot reload during local development.
# `oneshot` — fallback mode if hot reload causes issues (e.g. in large repos or with symlinks).
policy = "per_worker"
# Port to attach the Chrome inspector for debugging edge functions.
inspector_port = 8083
# The Deno major version to use.
deno_version = 2

# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

[analytics]
enabled = true
port = 54327
# Configure one of the supported backends: `postgres`, `bigquery`.
backend = "postgres"

# Experimental features may be deprecated any time
[experimental]
# Configures Postgres storage engine to use OrioleDB (S3)
orioledb_version = ""
# Configures S3 bucket URL, eg. <bucket_name>.s3-<region>.amazonaws.com
s3_host = "env(S3_HOST)"
# Configures S3 bucket region, eg. us-east-1
s3_region = "env(S3_REGION)"
# Configures AWS_ACCESS_KEY_ID for S3 bucket
s3_access_key = "env(S3_ACCESS_KEY)"
# Configures AWS_SECRET_ACCESS_KEY for S3 bucket
s3_secret_key = "env(S3_SECRET_KEY)"

# pg-delta is the schema diff engine for db diff / db pull / db remote commit.
# Set enabled = false to fall back to the legacy migra engine.
[experimental.pgdelta]
enabled = true
# Directory under `supabase/` where declarative files are written.
# declarative_schema_path = "./database"
# JSON string passed through to pg-delta SQL formatting.
# format_options = "{\"keywordCase\":\"upper\",\"indent\":2,\"maxWidth\":80,\"commaStyle\":\"trailing\"}"
