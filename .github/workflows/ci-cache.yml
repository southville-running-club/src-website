name: CI caches

# **Fills the browser and apt caches from `main`, so every pull request starts warm.**
#
# GitHub lets a workflow run restore a cache saved on its own branch or on the default branch,
# and nothing else. `ci.yml` runs only on pull requests, so until this existed every cache it
# saved belonged to one pull request: a 363 MB copy of the browsers for each of #352 to #356,
# and a new pull request's first run always downloaded everything, the 119 MB of system
# packages from the runner's Ubuntu mirror included. That download is what timed out eight
# acceptance jobs on 23 October 2026. A run here saves under `main`, which every pull request
# can restore.
#
# **It runs the same steps as the acceptance job**, through `.github/actions/browsers`, because
# a key that differed by a character would mean a pull request never found these entries.
#
# - **On a push to `main`**: a merge that moves Playwright's version changes the browser key.
#   When nothing has changed, both restores hit exactly, nothing is saved, and the run costs
#   the time of an `npm ci`.
# - **Weekly**: GitHub publishes a new runner image about once a week and the apt key carries
#   the image version, so this keeps an entry for the current image. A cache nobody reads for
#   seven days is evicted, and this is also what reads it.
# - **On demand** (`workflow_dispatch`), to warm the caches by hand.
#
# **It fills the Supabase image cache too, since 27 October 2026**, as a second job, through
# `.github/actions/supabase-images`. ghcr.io refused every database job's image pulls on four
# CI runs that day, and a cache hit pulls nothing. On a push to `main` that changes none of
# the key's parts, its restore hits exactly and the job does nothing else. It is the only
# writer of that cache, for the reason the action gives.

on:
  push:
    branches: [main]
  schedule:
    # Monday, 05:23 UTC. Off the hour, because scheduled runs at :00 queue behind everybody's.
    - cron: '23 5 * * 1'
  workflow_dispatch:

# Read-only, declared rather than inherited, as `ci.yml` does. Saving a cache uses the runner's
# own cache token, not `GITHUB_TOKEN`, so it needs no write permission here.
permissions:
  contents: read

# One at a time, and a run is never cancelled part-way through a save.
concurrency:
  group: ci-cache
  cancel-in-progress: false

jobs:
  fill:
    name: Fill the browser and apt caches
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # Not `.github/actions/bootstrap`: that starts Supabase and builds both Workers, and none
      # of it is needed to install browsers. `npm ci` is, because `npx playwright` and the
      # version the keys are made from both come from the workspace.
      - uses: actions/setup-node@v5
        with:
          node-version-file: platform/.nvmrc
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: platform
        run: npm ci

      - name: Browsers
        uses: ./.github/actions/browsers

  supabase-images:
    name: Fill the Supabase image cache
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The same three values `ci.yml` gives every job that starts Supabase, for the same reason:
    # the CLI validates the two `env()` substitutions in `config.toml` at `supabase start`, and
    # the registry decides the images' names, which have to match the ones CI asks for. Public
    # test values, not secrets. See `ci.yml`'s `verify` job for each one's history.
    env:
      SUPABASE_AUTH_CAPTCHA_SECRET: '1x0000000000000000000000000000000AA'
      SUPABASE_AUTH_SMTP_PASSWORD: 'local-development-only-not-a-real-key'
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

    steps:
      - uses: actions/checkout@v5

      - name: Supabase images
        id: images
        uses: ./.github/actions/supabase-images
        with:
          mode: restore

      # Everything below runs only when there is no entry for this exact key: a new CLI
      # version, a new Postgres major version, or a change to the exclusions.
      - uses: actions/setup-node@v5
        if: steps.images.outputs.cache-hit != 'true'
        with:
          node-version-file: platform/.nvmrc
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        if: steps.images.outputs.cache-hit != 'true'
        working-directory: platform
        run: npm ci

      # **The same script CI uses**, so the stack whose images are saved is the stack CI
      # starts. It loads whatever the partial restore above found and pulls the rest, with its
      # own retry on a rate limit.
      - name: Start the Supabase stack
        if: steps.images.outputs.cache-hit != 'true'
        working-directory: platform/packages/db
        run: |
          bash "$GITHUB_WORKSPACE/.github/actions/bootstrap/start-supabase.sh"
          cat /tmp/supabase-start.log
          exit "$(cat /tmp/supabase-start.rc)"

      - name: Save the Supabase images
        if: steps.images.outputs.cache-hit != 'true'
        uses: ./.github/actions/supabase-images
        with:
          mode: save

      - name: Stop the Supabase stack
        if: always() && steps.images.outputs.cache-hit != 'true'
        working-directory: platform/packages/db
        run: npx supabase stop --no-backup || true
