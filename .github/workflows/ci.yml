name: CI

# Every pull request. All gates must pass before review is meaningful — the other
# volunteer reading a diff should be reading a diff that works.
#
# **Not on push to main, and the reason previously given here was false.**
#
# This comment used to say that branch protection required the check to pass against an
# up-to-date branch before a pull request could merge, and that a second run after the merge
# would therefore test nothing new. Neither half was ever true: the repository is private on
# the free plan, the rulesets API answers
# `403 — Upgrade to GitHub Pro or make this repository public`, and
# `/branches/main/protection` answers `404`. Nothing requires this check to pass, and nothing
# requires a branch to be up to date before it merges.
#
# It was load-bearing rather than decorative — it is the whole justification #10 gave for
# removing the `push: [main]` trigger. So it is corrected here rather than deleted, because
# the next person to wonder why this only runs on pull requests deserves the real answer.
#
# **What is actually true, and what it leaves open:**
#
#   * A pull request merged with CI red merges. Nothing stops it.
#   * A branch merged while stale merges, having never run against what main becomes.
#   * A direct push to main runs no suite at all — and `smoke.yml` and `deploy-db.yml` both
#     trigger on that same push, so it deploys.
#
# The third is now noticed by `main-guard.yml`, which is detection rather than prevention
# and is all the free plan allows. The first two need a paid plan and are a committee
# decision, priced in issue #26.
#
# **Adding `push: [main]` back would close the stale-branch gap** and is deliberately not
# done here: at the measured rate this repository is already on course to spend its whole
# 2,000-minute monthly Actions allowance, and this suite starts a real Postgres, builds both
# Workers and runs Playwright across two engines. Roughly doubling its runs to catch a case
# a required-up-to-date-branch rule would catch for nothing is a trade worth making
# deliberately, not by default. See issue #26, part 7.
#
# The whole stack comes up here: `supabase start` runs in Actions, so this pipeline tests
# against a **real Postgres** rather than a substitute. That matters because there is no
# API tier between the browser and the database — row-level security is the access
# control, and a mocked database would only ever test the mock.
#
# See docs/architecture/decisions/adr-003-local-development-and-pipeline.md

on:
  pull_request:

# **Read-only, declared here rather than inherited.**
#
# Without this the job runs on whatever the repository's default workflow token grants, which
# is a settings page neither volunteer can see the state of from a diff and which can be
# changed without a commit. In the file it is reviewed like anything else and cannot silently
# drift. Nothing in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  # Keyed on the workflow as well as the ref. `ci-` was already unique among the three
  # workflows here, but only because all three were written by the same hand on the same day;
  # `github.workflow` makes that a property of the expression rather than of the coincidence.
  #
  # **What this does not do is stop two runs fighting over a port.** Every job gets its own
  # throwaway VM, so no two runs can contend for 54322 in the first place — the one time this
  # branch saw `address already in use`, it was a single `supabase start` racing its own
  # teardown after the image pulls came back `toomanyrequests` from public.ecr.aws. This
  # cancels superseded work, which is worth having on its own; it is not a fix for that.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # The npm project lives in platform/; the repository root is documentation.
    working-directory: platform

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The top-level default is platform/ — this job works from the repository root instead,
    # where docs/ and tools/ actually live.
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v5

      - name: Every internal link and anchor resolves
        # tools/check-doc-links.py. With ~50 cross-linked markdown files and a stated rule
        # that documentation ships with the change it describes, a human re-reading every
        # page on every pull request was the only enforcement — which is how a runbook
        # naming a superseded hostname survived unnoticed. This is cheap enough to run on
        # every push that there is no reason not to.
        run: python3 tools/check-doc-links.py

      - name: No page still claims a subdomain ADR-007 rules out
        # tools/check-no-live-subdomains.py. nn.<apex> and timing.<apex> are never created —
        # ADR-007 is explicit about the negative. This makes that decision self-enforcing:
        # a new page that casually reintroduces the superseded shape fails here instead of
        # surviving until the next full re-read finds it by hand.
        run: python3 tools/check-no-live-subdomains.py

  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    # **40 rather than 25, because 25 does not fit what this job is now allowed to do.**
    #
    # Measured on run 32868682059, a green one: setup to the end of `Install browsers` is
    # ~8 minutes, the serial config 2.7, the base config 5.7. Each is retried once
    # independently, so the budget the step can legitimately ask for is
    # 8 + (2.7 × 2) + (5.7 × 2) = **24.8** — under 25 by twelve seconds, on a shared runner,
    # with both retries firing. That is not a ceiling, it is a coin toss: that same run used
    # 21.4 minutes with only *one* retry.
    #
    # Losing the toss is worse than losing the time. The job is killed part-way through a
    # retry and the run reports `The operation was canceled`, which reads as somebody pressing
    # a button rather than as a suite worth looking at — which is exactly how run 32862836535
    # was misread.
    #
    # This is a ceiling, not consumption: a green run is ~18 minutes and bills ~18. It is
    # raised only as far as the paths that actually occur need, because a genuinely hung job
    # now bills 40 against a 2,000-minute monthly allowance already close to spent.
    timeout-minutes: 40

    env:
      # Pinned for the same reason the timing app pins it: without this the suite passes
      # or fails depending on the runner's timezone, and Nightingale Nightmare is raced
      # the weekend after the clocks change.
      TZ: UTC
      # Cloudflare's own published testing secret — "always passes", documented at
      # developers.cloudflare.com/turnstile/troubleshooting/testing — not the club's real
      # one. `config.toml`'s `[auth.captcha]` reads `env(SUPABASE_AUTH_CAPTCHA_SECRET)`, and
      # the Supabase CLI validates that substitution at startup: unset here, `supabase
      # start` fails before a single test runs. This is job-level so every step that
      # touches the Supabase CLI — start, reset, gen types — has it, not only the first.
      SUPABASE_AUTH_CAPTCHA_SECRET: '1x0000000000000000000000000000000AA'
      # Lifted to `env` so the step below can test it. The `secrets` context is not available
      # in a step-level `if`; `env` is, and this is the usual way round that.
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: platform/.nvmrc
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      # **An anonymous Docker Hub pull is rate limited per IP address, and the IP is not
      # ours.** `supabase start` pulls a dozen images — Postgres, GoTrue, Kong, PostgREST,
      # Storage, postgres-meta, Studio, Mailpit, Vector, Logflare — and a GitHub-hosted runner
      # shares its address with every other tenant that happens to be on it. So the limit can
      # already be spent before this job begins, by somebody else, and the run dies at the
      # first step that needs the network with `toomanyrequests: Rate exceeded`. It has
      # happened at least twice: run 31787327668 on 14 August and run 32868948264 today, the
      # latter nineteen times in one job. Nothing about the change under test is involved, and
      # the retry in the Acceptance step is far too late to help — this fails before a single
      # test runs.
      #
      # Signing in moves the limit from "this runner's address" to "this account", which is
      # the difference between a shared allowance and one nobody else can spend.
      #
      # **Skipped when the secret is absent, and that is the deployed state today**, so this
      # changes nothing until somebody adds it — section 7 of
      # docs/delivery/runbooks/github-setup.md. A read-only access token, not a password: it
      # only ever pulls public images, and one that can push could replace an image this
      # pipeline trusts in exchange for no extra allowance at all.
      - name: Sign in to Docker Hub, if a token is configured
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start the local Supabase stack
        working-directory: platform/packages/db
        run: npx supabase start

      - name: Export the local Supabase credentials
        working-directory: platform/packages/db
        # All three are the fixed local-stack values, not secrets. `SUPABASE_DB_URL` is the
        # privileged connection the seed tests use to check what is *in* a table while the
        # anon client checks what can be *reached* — testing an access boundary from one
        # side only proves half of it.
        run: |
          echo "SUPABASE_URL=$(npx supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(npx supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL=$(npx supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------------------
      # The gates, in order. Cheapest first, so a formatting slip does not wait on
      # Playwright.
      # ---------------------------------------------------------------------------------

      - name: Lint and format
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Migrations stay inside club, intake and entries
        # Cheap, needs no database, and it is what actually enforces the boundary
        # docs/decisions/decision-log.md reasons about. `--schema club,intake,entries` scopes
        # `supabase db diff`, which authors a migration — it has no effect on
        # `supabase db push --linked`, which is what deploy-db.yml runs on merge. This is
        # the backstop that makes the claim true rather than assumed.
        run: npm run db:migrations:check-scope

      - name: Generated types are current
        # Fails if `supabase gen types` would produce something other than what is
        # committed. Cheap to have from day one; annoying to retrofit, and the failure it
        # prevents is silent — types describing a schema the database no longer has.
        run: npm run db:types:check

      - name: Unit and database tests
        run: npm test

      - name: Migrations apply from zero
        working-directory: platform/packages/db
        # The only thing that proves a new volunteer, or a restored backup, can actually
        # reach the current schema. A migration set that only works incrementally is one
        # nobody can rebuild from.
        #
        # `db reset` is a **local** command. Running it against the shared remote would
        # destroy the timing platform's data — see ADR-002.
        #
        # Retried once: this recreates Postgres' own container, and that has failed on the
        # runner with an opaque `error running container: exit 1` that a same-machine retry
        # clears — never a schema problem, since the same migrations already passed
        # "Migrations stay inside club, intake and entries" and "Generated types are current"
        # above.
        run: |
          if npx supabase db reset; then
            exit 0
          fi
          echo "::warning::db reset failed, retrying once" >&2
          sleep 5
          npx supabase db reset

      - name: Build
        run: npm run build

      - name: Bundle the Workers
        # `opennextjs-cloudflare build` for apps/timing — the artefact that actually
        # deploys, so it is worth failing on here rather than on Cloudflare.
        #
        # A separate step from `build` on purpose: OpenNext produces the Next.js output by
        # running the package's own `build` script, so the two must never be the same
        # script. They were, once, and it recursed until the machine died.
        run: npm run build:worker

      - name: Worker tests
        # Inside the real Workers runtime via Miniflare, against the real build output.
        run: npm run test:worker

      # The browser binaries are downloaded from scratch on every run — Chromium and a 102MB
      # WebKit — to be used identically to last time. Keyed on the resolved Playwright version
      # rather than on `package-lock.json`, which changes on any dependency bump and would
      # discard them for a reason that has nothing to do with them. Read from the installed
      # package, so the key follows what `^1.62.1` actually resolved to.
      - name: Resolve the Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install browsers
        # **The system libraries are installed on a cache hit too, and that is not
        # belt-and-braces.** The cache holds `~/.cache/ms-playwright` — the browser binaries.
        # It does not hold the apt packages WebKit links against, which are not on the runner
        # image by default. Restoring the binaries alone gives a WebKit that fails to launch,
        # surfacing as every `mobile-safari` test failing at once rather than as anything
        # naming a missing library. `install-deps` is the cheap half of `--with-deps`; the
        # download is the expensive half, and it is what the cache removes.
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = 'true' ]; then
            npx playwright install-deps chromium webkit
          else
            npx playwright install --with-deps chromium webkit
          fi

      - name: Acceptance tests
        # Playwright, including axe at **zero** violations. Not "few" — any threshold
        # above zero becomes the new normal within a month, and 70% of visitors are on a
        # phone.
        #
        # `playwright test` directly rather than `npm run test:e2e`, because that script
        # builds first and the Build gate above has already done it.
        #
        # **Two runs, not one.** `playwright.config.serial.ts` is `nn-entry.spec.ts` and
        # `nn-signup.spec.ts` alone, at `workers: 1` — the one pair of files that must never
        # run on different workers at once, because they share `entries.events.entries_open_at`.
        # `playwright.config.ts` is everything else, free to use more than one worker now that
        # it has no race left to protect against. See either config's header.
        #
        # Each is retried once independently: `webServer` starts two `workerd` instances
        # alongside three browser engines, which is genuinely heavy for a shared runner (see
        # the note atop playwright.config.ts) and `wrangler dev` has been seen exiting on
        # startup, and crashing mid-run, with no error message that points at a cause in this
        # repository. Every one of these failures has been unreproducible locally, so this is
        # runner pressure, not the site — a full-suite retry is the honest way to absorb that
        # without pretending a threshold of individual flaky tests is fine.
        #
        # **The retry is skipped when a config hit `globalTimeout`, and that exclusion is the
        # point of this block rather than a detail of it.** The retry above answers "the
        # servers did not come up", where nothing ran and running it again is the only way to
        # learn anything. A global timeout is the opposite: the suite ran, it was passing, and
        # it was cut off for being long. Re-running it cannot make a config that needs more
        # than the ceiling finish inside it, so the second attempt is certain to fail the same
        # way after paying for it twice — and on this job that second ten minutes is what
        # turns a slow run into a killed one. Playwright exits 1 for both, so the message is
        # the only thing separating them.
        #
        # `--last-failed` is deliberately not used for the ordinary retry: on the startup
        # failure it exists for, no test has run and there is nothing to select.
        run: |
          set -o pipefail

          run_suite() {
            local config="$1"
            local label="${config%.ts}"
            local log="playwright-${label}.log"

            # One report per config, or the second run lands on the first's and the timing
            # summary describes half the suite while looking like all of it.
            export PLAYWRIGHT_JSON_OUTPUT_NAME="playwright-report/results-${label}.json"

            if npx playwright test --config="$config" 2>&1 | tee "$log"; then
              return 0
            fi
            if grep -q 'Timed out waiting .* for the test suite to run' "$log"; then
              echo "::error::$config exceeded its globalTimeout — not retrying, because a re-run cannot fit inside it either. Raise globalTimeout in platform/playwright.config.ts and timeout-minutes in ci.yml together." >&2
              return 1
            fi
            echo "::warning::acceptance tests ($config) failed, retrying the suite once" >&2
            npx playwright test --config="$config"
          }

          status=0
          run_suite playwright.config.serial.ts || status=1
          run_suite playwright.config.ts || status=1
          exit "$status"

      # `always()`, because the question this answers — where the suite spends its time — is
      # at its most useful when nothing is wrong. A summary that appears only on a red run is
      # one nobody reads until they are already busy with something else. Both configs' reports
      # are passed together, so the table covers the whole suite rather than the second half.
      - name: Where the suite spent its time
        if: always()
        run: python3 ../tools/suite-timing.py playwright-report/results-*.json >> "$GITHUB_STEP_SUMMARY"

      # **The reason the web server exited is written to a file nobody has ever read.** When
      # `wrangler dev` dies it prints `✘ [ERROR]` with an empty message and then
      # `Logs were written to ~/.config/.wrangler/logs/…`, and the run ends without that file
      # going anywhere — which is precisely why the note above can only say it exits with no
      # error message that points at a cause. The message exists; it is discarded.
      - name: Say why the web server exited
        if: failure()
        run: |
          # **Was it killed, or did it choose to exit?** The two are indistinguishable from
          # the console — wrangler prints the same empty error either way — and they have
          # nothing in common as problems. This is a 2-core, 7GB runner already holding a
          # dozen Supabase containers, two `workerd` instances, a Node stub and up to two
          # browsers, so the kernel running out of patience is not a remote possibility, and
          # if that is what happened the ring buffer is the only place that says so.
          # `|| true` throughout: a diagnostic step must not become the failure it diagnoses.
          echo "::group::Memory, and whether anything was killed for it"
          free -m || true
          sudo dmesg 2>/dev/null | grep -iE 'killed process|out of memory|oom' | tail -20 || true
          echo "::endgroup::"

          shopt -s nullglob
          logs=("$HOME/.config/.wrangler/logs/"*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "No wrangler logs — the web server did not write one."
            exit 0
          fi
          for log in "${logs[@]}"; do
            echo "::group::${log##*/}"
            tail -n 60 "$log"
            echo "::endgroup::"
          done

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: platform/playwright-report/
          retention-days: 7

      - name: Stop the local Supabase stack
        # Nothing stopped it before, on success or on failure. On a hosted runner that costs
        # nothing — the VM is destroyed with the job — but "nothing torn down" is only ever one
        # runner change away from being the reason the next run cannot bind 54322, and a
        # cleanup that exists is cheaper than the afternoon spent working out why.
        #
        # `always()`, so a failed suite still tidies up, and `|| true` because a cleanup step
        # must never be the thing that turns a run red.
        if: always()
        working-directory: platform/packages/db
        run: npx supabase stop --no-backup || true
