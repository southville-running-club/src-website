name: Deploy database

# Migrations and project configuration for the schemas **this repository owns**, applied
# on merge to main.
#
# This is the one place a deploy credential is accepted, and the asymmetry is deliberate
# rather than an oversight. Cloudflare needs none — its git integration pulls from GitHub,
# and a credential that does not exist cannot leak. A database has no equivalent, and the
# alternative is a volunteer running migrations from a laptop: unreviewed, unlogged, and
# invisible to the other volunteer.
#
# ## Two things to know about the ordering
#
# **Nothing sequences this against the Cloudflare deploy.** Workers Builds triggers on the
# push itself, not on a green run of this workflow, so the migration and the code that
# uses it go out concurrently and in no guaranteed order.
#
# That is survivable only because **expand–migrate–contract is a non-negotiable
# principle**: every schema change keeps the previously deployed code working, so the
# order genuinely does not matter. Roll code back; roll schema forward. If a change ever
# needs the migration to land first, that change is the thing to fix — not this workflow.
#
# **No migrations during a race-week change freeze.**
#
# See docs/architecture/investigations/deployment.md

on:
  push:
    branches: [main]
    paths:
      - 'platform/packages/db/supabase/migrations/**'
      # `config.toml` carries the exposed-schema list, which is as load-bearing as any
      # migration: a schema that is not on it is unreachable whatever its grants say.
      - 'platform/packages/db/supabase/config.toml'
      - '.github/workflows/deploy-db.yml'

  # Available by hand for the case the path filter misses, and for re-running a failure.
  #
  # **This is the widest hole in the repository and branch protection would not close it.**
  # A manual dispatch runs *the chosen branch's* copy of this workflow, with the three
  # production Supabase secrets, and any collaborator with write can do it from a branch
  # nobody has reviewed. The control that closes it is an Actions environment with a required
  # reviewer, which the note on the job below already identifies as the strongest argument
  # for paying. Recorded in issue #26 so it is a known gap rather than an unnoticed one.
  workflow_dispatch:

# Read-only for the repository, which is not the same as harmless — see the note above. The
# `GITHUB_TOKEN` needs nothing here: the credentials that matter are the three Supabase
# secrets in `env` below, and this declaration does not constrain those.
permissions:
  contents: read

concurrency:
  # Never two migration runs at once against one database.
  group: deploy-db
  cancel-in-progress: false

defaults:
  run:
    working-directory: platform/packages/db

jobs:
  push:
    name: supabase db push, then config push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # **No `environment: production` here, and it is not an omission.**
    #
    # GitHub's own wording: *"Organizations with GitHub Team and users with GitHub Pro can
    # configure environments for private repositories."* This repository is private on the
    # free plan, so declaring an environment would fail the job outright.
    #
    # What it would buy, when the plan question is settled: a **required reviewer** on the
    # one action that can destroy the timing platform's data. That is the strongest
    # argument for paying, and it is recorded rather than lost —
    # docs/decisions/decision-log.md.

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # The club's real Turnstile secret, read by `supabase config push` for
      # `config.toml`'s `[auth.captcha]` block — #53. Never the value itself, only the
      # reference; the digest-equivalent here is that this workflow never echoes it.
      SUPABASE_AUTH_CAPTCHA_SECRET: ${{ secrets.SUPABASE_AUTH_CAPTCHA_SECRET }}
      # The Resend API key, read by `supabase config push` for `config.toml`'s
      # `[auth.email.smtp]` block — #50. Same mechanism as the captcha secret above, and the
      # same masking: this workflow never echoes it, so a green run proves the file was
      # accepted rather than that the value is a real key. The proof is a confirmation email
      # arriving at a real inbox, which is why the runbook makes that a step.
      SUPABASE_AUTH_SMTP_PASSWORD: ${{ secrets.SUPABASE_AUTH_SMTP_PASSWORD }}

    steps:
      - name: Check the secrets exist
        # Without this the Supabase CLI fails several steps later with something about an
        # access token, which reads like a broken migration rather than an empty settings
        # page. **The first merge to main will hit this**, because the secrets cannot be
        # added until the Supabase project details are to hand.
        #
        # **Runs from the workspace root, not the job's platform/packages/db default.**
        # This step is the one thing in the job that runs *before* `actions/checkout` —
        # deliberately, so a missing secret fails in seconds rather than after a checkout,
        # an `npm ci` and a `supabase link`. But `platform/packages/db` does not exist yet
        # on a bare runner; only the workspace root does. Without this override the step
        # never reaches its own logic — bash itself fails to start with "No such file or
        # directory", which reads exactly like a missing-secrets failure and is not one.
        working-directory: .
        run: |
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "$SUPABASE_PROJECT_REF" ] || missing+=("SUPABASE_PROJECT_REF")
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing+=("SUPABASE_DB_PASSWORD")
          [ -n "$SUPABASE_AUTH_CAPTCHA_SECRET" ] || missing+=("SUPABASE_AUTH_CAPTCHA_SECRET")
          # #50. Unset, `config push` substitutes an empty password into
          # `[auth.email.smtp]` and GoTrue silently cannot send a single confirmation —
          # which is the failure this step exists to turn into one clear line.
          [ -n "$SUPABASE_AUTH_SMTP_PASSWORD" ] || missing+=("SUPABASE_AUTH_SMTP_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "See platform/packages/db/README.md for what each one is."
            exit 1
          fi
          echo "All five secrets are set."

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: platform/.nvmrc
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: platform
        run: npm ci

      - name: Link the project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show what would be applied
        # Logged before it happens, so the run itself is the record of what changed.
        run: npx supabase migration list --linked

      - name: Apply migrations
        # **`db push`, never `db reset`.** `reset` is a local command; against the shared
        # remote it would destroy everything, including — once the timing platform is
        # ported onto this project — the club's race history.
        #
        # This repository owns `club` and `intake` and must never propose a change to
        # `public` or `private`.
        #
        # ---------------------------------------------------------------------------------
        # `--include-all`, and what it costs
        # ---------------------------------------------------------------------------------
        # **Without it, one out-of-order migration stops production receiving anything, for
        # ever, silently.** That is not a theory: #134 authored migrations stamped 14:00–14:20
        # on 28 August while #131's outbox migrations, stamped 17:00 and later, had already
        # merged and deployed. `db push` then refuses the whole push — *before applying
        # anything* — and every merge after it inherits the same refusal. Three pull requests
        # landed on `main` and none of their schema reached production; the only signal was a
        # red workflow on a branch nobody watches, while every pull request went green.
        #
        # **The hazard the guard is about is real, and rarer than the one it causes.**
        # Applying a migration behind one already on the remote only matters when the two
        # touch the same object, because the later-applied statement wins. That is worth
        # catching — and what catches it is review and tests that exercise behaviour, which is
        # how `20260828200000_entries_audit_actions_reunited` came to exist: two branches
        # restated one closed list and the second silently dropped the first's value.
        #
        # **So this flag does not remove the ordering hazard, and pretending it does is the
        # mistake to avoid.** What it removes is a guard that answers a naming accident by
        # refusing every future deploy. A restated closed list — `admin_audit`'s actions,
        # `fees.code`, `entry_purchases.status` — is still a merge conflict git cannot see.
        run: npx supabase db push --linked --include-all

      - name: Apply project configuration
        # The exposed-schema list, and it belongs here rather than in a dashboard. A schema
        # that is not on it is unreachable whatever its grants say, so it is as
        # load-bearing as any migration — and this is what makes it code.
        #
        # **After the migrations, deliberately.** Exposing a schema that does not exist yet
        # is harmless but meaningless; this way the thing is created and then made
        # reachable, in that order.
        #
        # ⚠️ It pushes the **whole** `config.toml` — auth, storage and email settings travel
        # with it. That is the point (the file is the source of truth) and also the hazard:
        # anything changed by hand in the dashboard is overwritten on the next run. If you
        # need a setting, put it in the file.
        run: npx supabase config push --yes
