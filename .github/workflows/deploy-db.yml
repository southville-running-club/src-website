name: Deploy database

# Migrations and project configuration for the schemas **this repository owns**, applied
# on merge to main.
#
# This is the one place a deploy credential is accepted, and the asymmetry is deliberate
# rather than an oversight. Cloudflare needs none — its git integration pulls from GitHub,
# and a credential that does not exist cannot leak. A database has no equivalent, and the
# alternative is a volunteer running migrations from a laptop: unreviewed, unlogged, and
# invisible to the other volunteer.
#
# ## Two things to know about the ordering
#
# **Nothing sequences this against the Cloudflare deploy.** Workers Builds triggers on the
# push itself, not on a green run of this workflow, so the migration and the code that
# uses it go out concurrently and in no guaranteed order.
#
# That is survivable only because **expand–migrate–contract is a non-negotiable
# principle**: every schema change keeps the previously deployed code working, so the
# order genuinely does not matter. Roll code back; roll schema forward. If a change ever
# needs the migration to land first, that change is the thing to fix — not this workflow.
#
# **No migrations during a race-week change freeze.**
#
# See docs/architecture/investigations/deployment.md

on:
  push:
    branches: [main]
    paths:
      - 'platform/packages/db/supabase/migrations/**'
      # `config.toml` carries the exposed-schema list, which is as load-bearing as any
      # migration: a schema that is not on it is unreachable whatever its grants say.
      - 'platform/packages/db/supabase/config.toml'
      - '.github/workflows/deploy-db.yml'

  # Available by hand for the case the path filter misses, and for re-running a failure.
  workflow_dispatch:

concurrency:
  # Never two migration runs at once against one database.
  group: deploy-db
  cancel-in-progress: false

defaults:
  run:
    working-directory: platform/packages/db

jobs:
  push:
    name: supabase db push, then config push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # **No `environment: production` here, and it is not an omission.**
    #
    # GitHub's own wording: *"Organizations with GitHub Team and users with GitHub Pro can
    # configure environments for private repositories."* This repository is private on the
    # free plan, so declaring an environment would fail the job outright.
    #
    # What it would buy, when the plan question is settled: a **required reviewer** on the
    # one action that can destroy the timing platform's data. That is the strongest
    # argument for paying, and it is recorded rather than lost —
    # docs/decisions/decision-log.md.

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Check the secrets exist
        # Without this the Supabase CLI fails several steps later with something about an
        # access token, which reads like a broken migration rather than an empty settings
        # page. **The first merge to main will hit this**, because the secrets cannot be
        # added until the Supabase project details are to hand.
        run: |
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "$SUPABASE_PROJECT_REF" ] || missing+=("SUPABASE_PROJECT_REF")
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing+=("SUPABASE_DB_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "See platform/packages/db/README.md for what each one is."
            exit 1
          fi
          echo "All three secrets are set."

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: platform/.nvmrc
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: platform
        run: npm ci

      - name: Link the project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show what would be applied
        # Logged before it happens, so the run itself is the record of what changed.
        run: npx supabase migration list --linked

      - name: Apply migrations
        # **`db push`, never `db reset`.** `reset` is a local command; against the shared
        # remote it would destroy everything, including — once the timing platform is
        # ported onto this project — the club's race history.
        #
        # This repository owns `club` and `intake` and must never propose a change to
        # `public` or `private`.
        run: npx supabase db push --linked

      - name: Apply project configuration
        # The exposed-schema list, and it belongs here rather than in a dashboard. A schema
        # that is not on it is unreachable whatever its grants say, so it is as
        # load-bearing as any migration — and this is what makes it code.
        #
        # **After the migrations, deliberately.** Exposing a schema that does not exist yet
        # is harmless but meaningless; this way the thing is created and then made
        # reachable, in that order.
        #
        # ⚠️ It pushes the **whole** `config.toml` — auth, storage and email settings travel
        # with it. That is the point (the file is the source of truth) and also the hazard:
        # anything changed by hand in the dashboard is overwritten on the next run. If you
        # need a setting, put it in the file.
        run: npx supabase config push --yes
