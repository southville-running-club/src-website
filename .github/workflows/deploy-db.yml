name: Deploy database

# Migrations and project configuration for the schemas **this repository owns**, applied
# on merge to main.
#
# This is the one place a deploy credential is accepted, and the asymmetry is deliberate
# rather than an oversight. Cloudflare needs none — its git integration pulls from GitHub,
# and a credential that does not exist cannot leak. A database has no equivalent, and the
# alternative is a volunteer running migrations from a laptop: unreviewed, unlogged, and
# invisible to the other volunteer.
#
# ## Two things to know about the ordering
#
# **Nothing sequences this against the Cloudflare deploy.** Workers Builds triggers on the
# push itself, not on a green run of this workflow, so the migration and the code that
# uses it go out concurrently and in no guaranteed order.
#
# That is survivable only because **expand–migrate–contract is a non-negotiable
# principle**: every schema change keeps the previously deployed code working, so the
# order genuinely does not matter. Roll code back; roll schema forward. If a change ever
# needs the migration to land first, that change is the thing to fix — not this workflow.
#
# **No migrations during a race-week change freeze**, and since issue #23 that is a step in
# this job rather than a sentence in this comment. It was the rule most likely to be forgotten
# in precisely the week it exists for — the week when somebody is fixing something at eleven
# at night because the race is on Sunday. See "Race-week change freeze" below.
#
# See docs/architecture/investigations/deployment.md

on:
  push:
    branches: [main]
    paths:
      - 'platform/packages/db/supabase/migrations/**'
      # `config.toml` carries the exposed-schema list, which is as load-bearing as any
      # migration: a schema that is not on it is unreachable whatever its grants say.
      - 'platform/packages/db/supabase/config.toml'
      - '.github/workflows/deploy-db.yml'

  # Available by hand for the case the path filter misses, and for re-running a failure.
  #
  # **This is the widest hole in the repository and branch protection would not close it.**
  # A manual dispatch runs *the chosen branch's* copy of this workflow, with the three
  # production Supabase secrets, and any collaborator with write can do it from a branch
  # nobody has reviewed. The control that closes it is an Actions environment with a required
  # reviewer, which the note on the job below already identifies as the strongest argument
  # for paying. Recorded in issue #26 so it is a known gap rather than an unnoticed one.
  workflow_dispatch:
    inputs:
      override_freeze:
        description: 'Deploy during the race-week change freeze (needs a reason in the run notes)'
        type: boolean
        default: false


# Read-only for the repository, which is not the same as harmless — see the note above. The
# `GITHUB_TOKEN` needs nothing here: the credentials that matter are the three Supabase
# secrets in `env` below, and this declaration does not constrain those.
permissions:
  contents: read

concurrency:
  # Never two migration runs at once against one database.
  group: deploy-db
  cancel-in-progress: false

defaults:
  run:
    working-directory: platform/packages/db

jobs:
  push:
    name: supabase db push, then config push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # **No `environment: production` here, and it is not an omission.**
    #
    # GitHub's own wording: *"Organizations with GitHub Team and users with GitHub Pro can
    # configure environments for private repositories."* This repository is private on the
    # free plan, so declaring an environment would fail the job outright.
    #
    # What it would buy, when the plan question is settled: a **required reviewer** on the
    # one action that can destroy the timing platform's data. That is the strongest
    # argument for paying, and it is recorded rather than lost —
    # docs/decisions/decision-log.md.

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Race-week change freeze
        # **The freeze was a comment for as long as it has existed, and a comment does not
        # stop a deploy.** It is the rule most certain to be forgotten in the one week it is
        # for, by the person least able to absorb the consequence — a volunteer fixing
        # something at eleven at night with the race on Sunday.
        #
        # The window is derived, not invented: the race is **Sunday 1 November 2026** in
        # `apps/main/src/content/race.json`, and both phases.md and ADR-008 put the freeze at
        # "from the week before". That is Sunday 25 October, which is also the day the clocks
        # change, through race day itself.
        #
        # Hardcoded rather than parsed out of `race.json`, whose `date` is prose for a human
        # to read ("Sunday 1 November 2026"). Parsing English dates in bash to enforce a
        # safety rule is the more fragile of the two options, and this file is where somebody
        # looks when the freeze bites. **Next year's race means editing these two dates.**
        #
        # Runs before the secrets check and before checkout: it needs neither, and a run that
        # must not happen should stop in seconds.
        #
        # Issue #23, item 3.
        working-directory: .
        env:
          OVERRIDE: ${{ inputs.override_freeze }}
        run: |
          set -euo pipefail

          FREEZE_FROM='2026-10-25'
          FREEZE_UNTIL='2026-11-01'
          today="$(date -u +%Y-%m-%d)"

          if [[ "$today" < "$FREEZE_FROM" || "$today" > "$FREEZE_UNTIL" ]]; then
            echo "Not in the change freeze (${FREEZE_FROM} to ${FREEZE_UNTIL}). Today is ${today}."
            exit 0
          fi

          # The escape hatch is deliberate and deliberately awkward. A freeze nobody can
          # break is one somebody works around by running migrations from a laptop, which is
          # the unreviewed, unlogged path this whole workflow exists to replace. A manual
          # dispatch with the box ticked is a decision, attributable in the run log, made by
          # somebody who has read this.
          if [ "$OVERRIDE" = "true" ]; then
            echo "::warning::Deploying inside the race-week change freeze by explicit override."
            echo "Freeze: ${FREEZE_FROM} to ${FREEZE_UNTIL}. Today: ${today}."
            echo "Record what was deployed and why in docs/delivery/runbooks/supabase-setup.md."
            exit 0
          fi

          echo "::error::Refusing to migrate during the race-week change freeze."
          cat <<MESSAGE

          Today is ${today}, inside the change freeze (${FREEZE_FROM} to ${FREEZE_UNTIL}).

          Nightingale Nightmare is raced on Sunday 1 November 2026. The freeze runs from
          the week before, and it covers both applications: they share a hostname and a
          repository. See docs/delivery/phases.md and ADR-008.

          Nothing has been applied. The migration is still on main and will deploy on the
          first run after the freeze lifts.

          If this genuinely cannot wait — it is a fix for something already broken, not an
          improvement — run this workflow by hand from the Actions tab with
          "Deploy during the race-week change freeze" ticked, and say why in the run notes.
          Tell the other volunteer before you do, not after.

          MESSAGE
          exit 1

      - name: Check the secrets exist
        # Without this the Supabase CLI fails several steps later with something about an
        # access token, which reads like a broken migration rather than an empty settings
        # page. **The first merge to main will hit this**, because the secrets cannot be
        # added until the Supabase project details are to hand.
        #
        # **Runs from the workspace root, not the job's platform/packages/db default.**
        # This step is the one thing in the job that runs *before* `actions/checkout` —
        # deliberately, so a missing secret fails in seconds rather than after a checkout,
        # an `npm ci` and a `supabase link`. But `platform/packages/db` does not exist yet
        # on a bare runner; only the workspace root does. Without this override the step
        # never reaches its own logic — bash itself fails to start with "No such file or
        # directory", which reads exactly like a missing-secrets failure and is not one.
        working-directory: .
        run: |
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "$SUPABASE_PROJECT_REF" ] || missing+=("SUPABASE_PROJECT_REF")
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing+=("SUPABASE_DB_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "See platform/packages/db/README.md for what each one is."
            exit 1
          fi
          echo "All three secrets are set."

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: platform/.nvmrc
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        working-directory: platform
        run: npm ci

      - name: Link the project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show what would be applied
        # Logged before it happens, so the run itself is the record of what changed.
        run: npx supabase migration list --linked

      - name: Show the plan that is about to run
        # **The one action in this repository with no rollback, and until now the review
        # artefact was the SQL file rather than the plan that would actually run.**
        #
        # `--dry-run` asks the live database what `db push` would do against it, and prints
        # it without doing it. The run log then becomes the record of what changed, next to
        # the `migration list` above which says only *which* migrations are pending.
        #
        # **Here rather than on the pull request, and that is a deliberate trade.** A dry-run
        # needs `--linked`, which needs `SUPABASE_ACCESS_TOKEN`. Branches here are internal
        # rather than forks, so secrets are technically available to a pull-request run — but
        # handing a production database credential to code from an unmerged branch is a
        # pattern that wants a reason, not a default. Running it here means no credential
        # ever meets an unreviewed branch.
        #
        # **What that costs is pre-merge visibility**, which is real and is not covered by
        # anything else: the plan appears seconds before it is executed rather than while
        # somebody is reviewing. What a reviewer has is the migration SQL itself and CI's
        # "Migrations apply from zero". Nothing rehearses the incremental apply against a
        # populated database — see docs/architecture/investigations/deployment.md, which
        # records why that was judged not worth its maintenance rather than merely missed.
        #
        # Non-fatal. A CLI that cannot produce a plan is not a reason to refuse a migration
        # that `migration list` has already shown to be pending, and failing here would turn
        # a reporting step into a new way for the deploy to break.
        #
        # Issue #23, item 4.
        continue-on-error: true
        run: npx supabase db push --linked --dry-run

      - name: Apply migrations
        # **`db push`, never `db reset`.** `reset` is a local command; against the shared
        # remote it would destroy everything, including — once the timing platform is
        # ported onto this project — the club's race history.
        #
        # This repository owns `club` and `intake` and must never propose a change to
        # `public` or `private`.
        run: npx supabase db push --linked

      - name: Apply project configuration
        # The exposed-schema list, and it belongs here rather than in a dashboard. A schema
        # that is not on it is unreachable whatever its grants say, so it is as
        # load-bearing as any migration — and this is what makes it code.
        #
        # **After the migrations, deliberately.** Exposing a schema that does not exist yet
        # is harmless but meaningless; this way the thing is created and then made
        # reachable, in that order.
        #
        # ⚠️ It pushes the **whole** `config.toml` — auth, storage and email settings travel
        # with it. That is the point (the file is the source of truth) and also the hazard:
        # anything changed by hand in the dashboard is overwritten on the next run. If you
        # need a setting, put it in the file.
        run: npx supabase config push --yes
